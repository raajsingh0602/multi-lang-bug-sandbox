name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt

  compile-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Compile Java
        run: javac java/src/*.java -d java/build

  run-python-tests:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Run Python tests
        run: pytest tests/ -v

  compile-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd typescript && npm install
      - name: Compile TypeScript
        run: cd typescript && npx tsc

  aggregate-results:
    runs-on: ubuntu-latest
    needs: [run-python-tests, compile-java, compile-typescript]
    if: always()
    steps:
      - name: Aggregate CI results
        run: |
          echo "=== CI/CD Pipeline Results ==="
          echo "All stages completed"
